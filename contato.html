<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford Brasil | Contato</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="stylesheet" href="css/contato.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="img/ford-96.png" alt="Logo da Ford"></a>
        </div>
         
        <center>
            <nav>
                <a href="index.html">Home</a>
                <a href="lancamentos.html">Lançamento</a>
                 <a href="contato.html">Contato</a>
            </nav>
        </center> 

    </header> 

    <main>

        <section>
            <img width="500px" src="img/xls 2.2 diesel.jpg" alt="">
        </section>
        
        <section class="divFormulario">

            <div style="margin: 15px 0;">
                <span style="margin: 10px 8px; color: blue;"><b>Sobre você</b></span>
            </div> 

            <form onsubmit="Post(this);">

                <input class="campo" required type="text" placeholder="Nome"> 

                <input class="campo" required type="email" placeholder="E-mail"> 

                <input class="campo" required type="text" placeholder="Telefone">

                <select class="campo" required name="" id="">
                    <option value="0" selected disabled hidden >Tipo de contato</option>
                    <option value="1">Elogio</option>
                    <option value="2">Reclamação</option>
                    <option value="3">Solicitação</option>
                </select>

                <textarea id="campoMensagem" placeholder="Escreva sua mensagem aqui"></textarea> <br>
                
                <button type="submit">Enviar</button>

            </form>

        </section>
    </main>

    <footer>
        <div class="divRedes">
        <p>Redes Sociais</p>
        <a target="_blank" href="https://www.instagram.com/fordbrasil"><img width="30px" src="img/instagram-logo-50.png" alt="Instagram da Ford Brasil"></a>
        <a target="_blank" href="https://www.facebook.com/FordBrasil"><img width="30px" src="img/facebook-50.png" alt="Facebook da  Ford Brasil"></a>  
        <a target="_blank" href="https://www.youtube.com/fordbrasil"><img width="30px" src="img/youtube-squared-50.png" alt="YouTube da Ford Brasil"></a> 
        </div>

        <div style="text-align: center;">
            &copy;2026 Ford Motor Company. Todos os direitos reservados.
        </div>
        
        <div style="text-align: end;">
            <img src="img/ford-96.png" alt="Logo da Ford">
        </div>
        
    </footer>

    <script src="js/form.js"></script>

</body>
</html>
